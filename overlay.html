<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
	<meta content="utf-8" http-equiv="encoding" />
	<meta name="copyright" content="&copy; 2020 Steve Seguin" />
	<link rel="icon" type="image/svg+xml" href="favicon.svg" />
	<link rel="shortcut icon" href="favicon.svg" />
	<title>Buon Inglese Overlay</title>
	<meta name="title" content="Buon Inglese Overlay" />
	<meta name="description" content="English-Italian bilingual caption overlay." />
	<meta name="author" content="Steve Seguin" />

	<style>
		@font-face {
			font-family: 'Cousine';
			src: url('fonts/Cousine-Bold.ttf') format('truetype');
		}

		:root {
			--bg: #030814;
			--panel: rgba(10, 21, 39, 0.92);
			--panel-2: rgba(13, 29, 50, 0.96);
			--line: rgba(111, 168, 255, 0.16);
			--text: #edf5ff;
			--muted: #9fb6d8;
			--blue: #2498eb;
			--blue-2: #58beff;
			--shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
			--radius: 18px;
		}

		* {
			box-sizing: border-box;
		}

		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			font-family: Inter, Arial, sans-serif;
			background:
				radial-gradient(circle at top left, rgba(36, 152, 235, 0.16), transparent 28%),
				linear-gradient(180deg, #07111f 0%, #030814 100%);
			color: var(--text);
			overflow: hidden;
		}

		body {
			padding: 18px;
		}

		.overlay-grid {
			display: grid;
			grid-template-columns: 1fr 1fr;
			grid-template-rows: auto 1fr auto;
			gap: 16px;
			width: 100%;
			height: 100%;
		}

		.header {
			grid-column: 1 / -1;
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding: 14px 18px;
			border-radius: 16px;
			background: rgba(8, 19, 35, 0.86);
			border: 1px solid var(--line);
			box-shadow: var(--shadow);
		}

		.header-title {
			font-size: 14px;
			font-weight: 800;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			color: #d7e8ff;
		}

		.header-subtitle {
			font-size: 12px;
			color: var(--muted);
			margin-top: 4px;
		}

		.header-badge {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			padding: 10px 12px;
			border-radius: 999px;
			background: rgba(36, 152, 235, 0.12);
			border: 1px solid rgba(88, 190, 255, 0.22);
			color: #d6ecff;
			font-size: 12px;
			font-weight: 700;
		}

		.panel {
			min-width: 0;
			min-height: 0;
			display: flex;
			flex-direction: column;
			background: linear-gradient(180deg, rgba(13, 29, 50, 0.95) 0%, rgba(8, 19, 35, 0.96) 100%);
			border: 1px solid var(--line);
			border-radius: var(--radius);
			box-shadow: var(--shadow);
			overflow: hidden;
		}

		.panel-head {
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding: 14px 16px;
			border-bottom: 1px solid rgba(111, 168, 255, 0.12);
			background: rgba(255, 255, 255, 0.025);
		}

		.panel-title {
			font-size: 12px;
			font-weight: 800;
			text-transform: uppercase;
			letter-spacing: 0.08em;
			color: #d7e8ff;
		}

		.panel-tag {
			font-size: 11px;
			color: var(--muted);
			padding: 6px 8px;
			border-radius: 999px;
			background: rgba(255,255,255,0.04);
			border: 1px solid rgba(111, 168, 255, 0.1);
		}

		.stream {
			flex: 1;
			min-height: 0;
			overflow-y: auto;
			padding: 18px;
		}

		.stream::-webkit-scrollbar {
			width: 10px;
		}

		.stream::-webkit-scrollbar-thumb {
			background: rgba(88, 190, 255, 0.18);
			border-radius: 999px;
		}

		.caption-line {
			display: block;
			width: 100%;
			margin-bottom: 12px;
			padding: 14px 16px;
			border-radius: 14px;
			background: rgba(0, 0, 0, 0.34);
			border: 1px solid rgba(111, 168, 255, 0.08);
			color: var(--text);
			font-family: Cousine, monospace;
			font-size: clamp(1rem, 1.4vw, 1.45rem);
			line-height: 1.5;
			overflow-wrap: anywhere;
			box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
		}

		.caption-line.source {
			border-left: 4px solid rgba(88, 190, 255, 0.65);
		}

		.caption-line.target {
			border-left: 4px solid rgba(36, 152, 235, 0.95);
			font-size: clamp(1.1rem, 1.6vw, 1.7rem);
		}

		.interim-row {
			grid-column: 1 / -1;
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 16px;
			min-height: 120px;
		}

		.interim-box {
			background: rgba(6, 15, 29, 0.88);
			border: 1px solid var(--line);
			border-radius: 16px;
			padding: 14px 16px;
			box-shadow: var(--shadow);
			min-height: 0;
			overflow: hidden;
		}

		.interim-label {
			font-size: 11px;
			text-transform: uppercase;
			letter-spacing: 0.08em;
			color: var(--muted);
			margin-bottom: 10px;
		}

		.interim-content {
			font-family: Cousine, monospace;
			font-size: clamp(0.95rem, 1.25vw, 1.15rem);
			line-height: 1.45;
			color: #dcecff;
			overflow-wrap: anywhere;
			opacity: 0.95;
		}

		.empty {
			color: #7891b3;
		}

		#status {
			display: none;
		}

		@media (max-width: 900px) {
			.overlay-grid {
				grid-template-columns: 1fr;
				grid-template-rows: auto 1fr 1fr auto auto;
			}

			.interim-row {
				grid-template-columns: 1fr;
			}
		}

		@media (max-width: 640px) {
			body {
				padding: 12px;
			}

			.header,
			.panel,
			.interim-box {
				border-radius: 14px;
			}

			.caption-line.target {
				font-size: 1.05rem;
			}
		}
	</style>
</head>
<body>
	<div class="overlay-grid">
		<div class="header">
			<div>
				<div class="header-title">Buon Inglese Live Overlay</div>
				<div class="header-subtitle">Bilingual English ↔ Italian display</div>
			</div>
			<div class="header-badge" id="headerBadge">Waiting for captions</div>
		</div>

		<section class="panel">
			<div class="panel-head">
				<div class="panel-title" id="sourcePanelTitle">Original</div>
				<div class="panel-tag" id="sourcePanelTag">Source speech</div>
			</div>
			<div class="stream" id="sourceOutput">
				<div class="caption-line source empty">The original speech will appear here.</div>
			</div>
		</section>

		<section class="panel">
			<div class="panel-head">
				<div class="panel-title" id="targetPanelTitle">Translation</div>
				<div class="panel-tag" id="targetPanelTag">Translated output</div>
			</div>
			<div class="stream" id="targetOutput">
				<div class="caption-line target empty">The translated text will appear here.</div>
			</div>
		</section>

		<div class="interim-row">
			<div class="interim-box">
				<div class="interim-label" id="sourceInterimLabel">Listening</div>
				<div class="interim-content" id="sourceInterim">Waiting for live speech…</div>
			</div>
			<div class="interim-box">
				<div class="interim-label" id="targetInterimLabel">Translating</div>
				<div class="interim-content" id="targetInterim">Translation preview will appear here…</div>
			</div>
		</div>
	</div>

	<div id="status"></div>

	<script src="tts-integration.js"></script>
	<script src="translation-providers.js"></script>
	<script>
		(function (w) {
			w.URLSearchParams = w.URLSearchParams || function (searchString) {
				var self = this;
				self.searchString = searchString;
				self.get = function (name) {
					var results = new RegExp('[\\?&]' + name + '=([^&#]*)').exec(self.searchString);
					if (results == null) {
						return null;
					}
					return decodeURI(results[1]) || 0;
				};
			};
		})(window);

		var urlParams = new URLSearchParams(window.location.search);

		let worker;
		let modelRegistry;
		let version;

		let supportedFromCodes = {};
		let supportedToCodes = {};
		let currentTo = null;

		const status = function(message){document.getElementById("status").innerText = message;}

		const getLocaleFromLang = (lang) => {
			if (!lang) return null;
			if (lang.includes("-")) return lang;
			const localeMap = {
				en: "en-US",
				es: "es-ES",
				fr: "fr-FR",
				de: "de-DE",
				it: "it-IT",
				pt: "pt-PT",
				ru: "ru-RU",
				zh: "zh-CN",
				ja: "ja-JP",
				ko: "ko-KR"
			};
			return localeMap[lang.toLowerCase()] || `${lang}-${lang.toUpperCase()}`;
		};

		let currentLanguage = "en-US";

		const translationParams = ["translate", "lang", "ln"];
		const hasTranslation = translationParams.some(param => urlParams.has(param));
		const translationLang =
			hasTranslation ? (translationParams.map(param => urlParams.get(param)).find(val => val) || "en") : false;
		const langTo = translationLang ? translationLang.split("-")[0] : false;
		const dualOverlay = true;

		const fallbackGoogleApiKey = urlParams.get("googlekey") || urlParams.get("gkey") || false;
		const fallbackAutoDetect = urlParams.has("autodetect") || urlParams.get("fromlang") === "auto";
		const forceLocal = urlParams.has("forcelocal");
		const translationConfigBase = (window.CaptionTranslationProviders && window.CaptionTranslationProviders.resolveConfig)
			? window.CaptionTranslationProviders.resolveConfig(urlParams, { forceLocal: forceLocal })
			: {
				provider: fallbackGoogleApiKey ? "google" : "local",
				apiKey: fallbackGoogleApiKey || "",
				googleApiKey: fallbackGoogleApiKey || "",
				endpoint: "",
				model: "",
				forceLocal: forceLocal,
				autoDetect: fallbackAutoDetect
			};

		const translationProvider = translationConfigBase.provider || "local";
		const googleApiKey = translationConfigBase.googleApiKey || fallbackGoogleApiKey || false;
		const autoDetectLang = Boolean(translationConfigBase.autoDetect);

		const useContext = urlParams.has("context") || urlParams.has("fullcontext");
		const contextSize = parseInt(urlParams.get("contextsize")) || 2;
		let messageHistory = [];

		const translationCache = new Map();
		const CACHE_DURATION = 24 * 60 * 60 * 1000;

		function preserveOriginal(meta, text, isInterim){
			if (!dualOverlay || !meta || !text) return;
			const key = isInterim ? "originalInterm" : "originalFinal";
			if (!meta[key]) meta[key] = text;
		}

		const ttsParams = ["speech", "speak", "tts"];
		const hasTTS = ttsParams.some(param => urlParams.has(param));
		const ttsLang = hasTTS ? (ttsParams.map(param => urlParams.get(param)).find(val => val)) : null;

		const langs = {
			"bg": "Bulgarian",
			"cs": "Czech",
			"nl": "Dutch",
			"en": "English",
			"et": "Estonian",
			"de": "German",
			"fr": "French",
			"is": "Icelandic",
			"it": "Italian",
			"nb": "Norwegian Bokmål",
			"nn": "Norwegian Nynorsk",
			"fa": "Persian",
			"pl": "Polish",
			"pt": "Portuguese",
			"ru": "Russian",
			"es": "Spanish",
			"uk": "Ukrainian"
		};

		function detectDirection(text) {
			const rtlChars = /[\u0591-\u07FF\u200F\u202B\u202E\uFB1D-\uFDFD\uFE70-\uFEFC]/;
			return rtlChars.test(text) ? "rtl" : "ltr";
		}

		function sanitize(string) {
			var temp = document.createElement('div');
			temp.innerHTML = string;
			let decodedAndStrippedText = temp.textContent || temp.innerText || "";
			decodedAndStrippedText = decodedAndStrippedText.substring(0, Math.min(decodedAndStrippedText.length, 500));
			return decodedAndStrippedText.trim();
		}

		function setPanelLabels(sourceLangCode) {
			const normalized = (sourceLangCode || "").toLowerCase();
			let sourceName = "Original";
			let targetName = "Translation";

			if (normalized.startsWith("it")) {
				sourceName = "Italiano";
				targetName = "English";
			} else if (normalized.startsWith("en")) {
				sourceName = "English";
				targetName = "Italiano";
			}

			document.getElementById("sourcePanelTitle").textContent = sourceName;
			document.getElementById("targetPanelTitle").textContent = targetName;
			document.getElementById("sourceInterimLabel").textContent = sourceName + " • live";
			document.getElementById("targetInterimLabel").textContent = targetName + " • preview";
			document.getElementById("headerBadge").textContent = sourceName + " → " + targetName;
		}

		function prependLine(containerId, text, kind) {
			if (!text || !text.trim()) return;
			const container = document.getElementById(containerId);

			const first = container.firstElementChild;
			if (first && first.classList.contains("empty")) {
				first.remove();
			}

			const line = document.createElement("div");
			line.className = "caption-line " + kind;
			line.setAttribute("dir", detectDirection(text));
			line.textContent = sanitize(text);
			container.prepend(line);

			while (container.children.length > 6) {
				container.removeChild(container.lastElementChild);
			}
		}

		function setInterim(containerId, text) {
			const el = document.getElementById(containerId);
			if (!text || !text.trim()) {
				el.textContent = containerId === "sourceInterim" ? "Waiting for live speech…" : "Translation preview will appear here…";
				return;
			}
			el.setAttribute("dir", detectDirection(text));
			el.textContent = sanitize(text);
		}

		async function translateViaProvider(text, sourceLang, targetLang) {
			if (!text.trim()) return null;
			if (!window.CaptionTranslationProviders || !window.CaptionTranslationProviders.translateText) return null;

			const useAutoDetect = autoDetectLang || sourceLang === "auto";
			const requestConfig = Object.assign({}, translationConfigBase, {
				autoDetect: useAutoDetect
			});

			if (!window.CaptionTranslationProviders.canUseRemoteProvider(requestConfig)) return null;

			const cacheKey = window.CaptionTranslationProviders.buildCacheKey(
				requestConfig,
				text,
				sourceLang,
				targetLang,
				useAutoDetect
			);

			if (!useAutoDetect) {
				const cached = translationCache.get(cacheKey);
				if (cached && Date.now() - cached.timestamp < CACHE_DURATION) {
					return cached.translation;
				}
			}

			const result = await window.CaptionTranslationProviders.translateText(
				requestConfig,
				text,
				sourceLang,
				targetLang
			);

			if (!result || !result.translatedText) return null;

			if (!useAutoDetect) {
				translationCache.set(cacheKey, {
					translation: result.translatedText,
					timestamp: Date.now(),
					detectedLang: result.detectedSourceLanguage || null
				});
			}

			return result.translatedText;
		}

		setInterval(() => {
			const now = Date.now();
			for (const [key, value] of translationCache.entries()) {
				if (now - value.timestamp > CACHE_DURATION) {
					translationCache.delete(key);
				}
			}
		}, 60 * 60 * 1000);

		class TextToSpeech {
			constructor(urlParams = new URLSearchParams(window.location.search)) {
				this.speech = false;
				this.premiumQueueTTS = [];
				this.premiumQueueActive = false;
				this.initializeSettings(urlParams);
				this.initializeVoices();
				this.initializeAudio();
			}

			initializeSettings(urlParams) {
				this.settings = {
					speechLang: ttsLang ? getLocaleFromLang(ttsLang) : langTo ? getLocaleFromLang(langTo) : null,
					volume: parseFloat(urlParams.get("volume")) || 1,
					pitch: parseFloat(urlParams.get("pitch")) || 0,
					rate: parseFloat(urlParams.get("rate")) || 1,
					voiceLatency: parseInt(urlParams.get("latency")) || 4,
					voiceGender: urlParams.get("gender") || false,
					voiceName: urlParams.get("voice") || false,
					google: {
						apiKey: urlParams.get("ttskey") || urlParams.get("googlettskey") || false,
						rate: urlParams.has("googlerate") ? parseFloat(urlParams.get("googlerate")) : 1,
						pitch: urlParams.has("googlepitch") ? parseFloat(urlParams.get("googlepitch")) : 0,
						audioProfile: urlParams.get("googleaudioprofile") || false,
						voiceName: urlParams.get("voicegoogle") || false
					},
					elevenLabs: {
						apiKey: urlParams.get("elevenlabskey") || false,
						latency: urlParams.has("elevenlatency") ? parseInt(urlParams.get("elevenlatency")) : 4,
						stability: urlParams.has("elevenstability") ? parseFloat(urlParams.get("elevenstability")) : 0.5,
						similarity: urlParams.has("elevensimilarity") ? parseFloat(urlParams.get("elevensimilarity")) : 0.75,
						style: urlParams.has("elevenstyle") ? parseFloat(urlParams.get("elevenstyle")) : 0.5,
						speakingRate: urlParams.has("elevenrate") ? parseFloat(urlParams.get("elevenrate")) : 1.0,
						speakerBoost: urlParams.has("elevenspeakerboost"),
						voiceName: urlParams.get("voice11") || urlParams.get("elevenlabsvoice") || false,
						model: urlParams.get("elevenlabsmodel") || "eleven_multilingual_v2"
					},
					speechify: {
						apiKey: urlParams.get("speechifykey") || false,
						speed: urlParams.has("speechifyspeed") ? parseFloat(urlParams.get("speechifyspeed")) : 1.0,
						model: urlParams.get("speechifymodel") || 'simba-english',
						voiceName: urlParams.get("voicespeechify") || false
					}
				};

				if (urlParams.has("speech") || urlParams.has("speak") || urlParams.has("tts")) {
					this.speech = true;
				}
			}

			initializeVoices() {
				this.voices = null;
				this.voice = false;
				try {
					this.voices = window.speechSynthesis.getVoices();
				} catch (e) {
					console.error("TTS not supported");
				}
			}

			initializeAudio() {
				if (this.settings.google.apiKey || this.settings.elevenLabs.apiKey || this.settings.speechify.apiKey) {
					this.audio = document.createElement("audio");
					this.audio.onended = () => this.finishedAudio();
				}
			}

			speak(text, allow = false) {
				if ((!this.speech && !allow) || !text) return;
				const languageToUse = this.settings.speechLang || currentLanguage;
				this.useNativeTTS(text, languageToUse);
			}

			useNativeTTS(text, language) {
				if (!this.voices && this.voices === null) return;
				const speechInput = new SpeechSynthesisUtterance();
				speechInput.lang = language;
				if (!this.voice) this.selectVoice(language);
				if (this.voice) speechInput.voice = this.voice;
				speechInput.volume = this.settings.volume;
				speechInput.rate = this.settings.rate;
				speechInput.pitch = this.settings.pitch;
				speechInput.text = text;

				if (window.speechSynthesis) {
					window.speechSynthesis.speak(speechInput);
				}
			}

			selectVoice(language) {
				if (!this.voices || !this.voices.length) {
					if (window.speechSynthesis) this.voices = window.speechSynthesis.getVoices();
				}
				if (this.voices) {
					if (this.settings.voiceName) {
						this.voice = this.voices.find(v =>
							v.name.toLowerCase().includes(this.settings.voiceName.toLowerCase()) &&
							v.lang.toLowerCase().startsWith(language.split('-')[0].toLowerCase())
						);
					}
					if (!this.voice) {
						this.voice = this.voices.find(v =>
							v.lang.toLowerCase() === language.toLowerCase() ||
							v.lang.split('-')[0].toLowerCase() === language.split('-')[0].toLowerCase()
						);
					}
					if (!this.voice && this.voices.length) this.voice = this.voices[0];
				}
			}
		}

		const tts = new TextToSpeech();

		if (langTo){
			var langFrom = autoDetectLang ? "auto" : (urlParams.get("fromlang") || "en");
			var needsTranslation = autoDetectLang || (langFrom.split('-')[0].toLowerCase() !== langTo.split('-')[0].toLowerCase());
			let remoteTranslationEnabled = (translationProvider !== "local") && !forceLocal;

			if (translationProvider === "google" && remoteTranslationEnabled && !googleApiKey) {
				remoteTranslationEnabled = false;
				status("Google provider requires API key");
			}

			if (needsTranslation && !remoteTranslationEnabled && !autoDetectLang) {
				if (window.Worker) {
					worker = new Worker("worker.js");
					worker.postMessage(["import"]);
				}
			}

			var translateCall = async (text, meta, interm=false) => {
				if (!text.trim().length) return;

				const isInterim = Boolean(interm);
				if (dualOverlay && meta) {
					const sourceText = isInterim ? (meta?.interm || text) : (meta?.final || text);
					if (sourceText) preserveOriginal(meta, sourceText, isInterim);
				}

				const passThroughText = () => {
					if (!meta) return;
					processReply(meta, interm);
				};

				needsTranslation = autoDetectLang || (langFrom.split('-')[0].toLowerCase() !== langTo.split('-')[0].toLowerCase());

				if (!needsTranslation && !autoDetectLang) {
					passThroughText();
					return;
				}

				if (remoteTranslationEnabled) {
					try {
						const translation = await translateViaProvider(text, langFrom, langTo);
						if (translation) {
							if (meta.final) {
								meta.final = translation;
								processReply(meta, interm);
							} else if (meta.interm) {
								meta.interm = translation;
								processReply(meta, interm);
							}
							return;
						}
					} catch (error) {
						console.error("Remote translation failed, falling back to local:", error);
						status(`Translation error: ${error.message}`);
						if (worker) {
							const paragraphs = text.split("\n");
							worker.postMessage(["translate", langFrom, langTo, paragraphs, meta, interm]);
							return;
						}
					}
				} else if (worker) {
					const paragraphs = text.split("\n");
					worker.postMessage(["translate", langFrom, langTo, paragraphs, meta, interm]);
					return;
				}

				passThroughText();
			};

			if (worker) {
				worker.onmessage = function (e) {
					if (e.data[0] === "translate_reply" && e.data[1]) {
						if (e.data[2].final) {
							e.data[2].final = e.data[1].join("<br /><br />");
							processReply(e.data[2], (e.data[3]||false));
						} else if (e.data[2].interm) {
							e.data[2].interm = e.data[1].join("<br /><br />");
							processReply(e.data[2], (e.data[3]||false));
						}
					} else if (e.data[0] === "load_model_reply" && e.data[1]) {
						status(e.data[1]);
					} else if (e.data[0] === "import_reply" && e.data[1]) {
						modelRegistry = e.data[1];
						version = e.data[2];
						init();
					}
				};
			}

			var loadModel = () => {
				needsTranslation = langFrom.split('-')[0].toLowerCase() !== langTo.split('-')[0].toLowerCase();
				if (needsTranslation && worker) {
					status(`Installing model...`);
					worker.postMessage(["load_model", langFrom, langTo]);
				}
			};

			function init() {
				supportedFromCodes["en"] = "prod";
				supportedToCodes["en"] = "prod";
				for (const [langPair, value] of Object.entries(modelRegistry)) {
					const firstLang = langPair.substring(0, 2);
					const secondLang = langPair.substring(2, 4);
					if (firstLang !== "en") supportedFromCodes[firstLang] = value.model.modelType;
					if (secondLang !== "en") supportedToCodes[secondLang] = value.model.modelType;
				}
				loadModel();
			}
		} else {
			var translateCall = console.log;
		}

		var roomID = "test";
		if (urlParams.has("room")){
			roomID = urlParams.get("room");
		} else if (urlParams.has("ROOM")){
			roomID = urlParams.get("ROOM");
		} else {
			try {
				var storedRoom = localStorage.getItem('cn_room_id') || "";
				if (storedRoom && /^[A-Za-z0-9]{12,}$/.test(storedRoom)) {
					roomID = storedRoom;
				} else {
					window.location.href = "./speechin";
				}
			} catch (e) {
				window.location.href = "./speechin";
			}
		}
		try { localStorage.setItem('cn_room_id', roomID); } catch (e) {}

		var socket;
		var reconnectTimer = null;
		let retryCount = 0;
		const maxRetryDelay = 30000;
		const baseDelay = 1000;

		function getRetryDelay() {
			if (retryCount === 0) return 0;
			return Math.min(baseDelay * Math.pow(2, retryCount - 1), maxRetryDelay);
		}

		function clearReconnectTimer() {
			if (reconnectTimer) {
				clearTimeout(reconnectTimer);
				reconnectTimer = null;
			}
		}

		function scheduleReconnect() {
			if (reconnectTimer) return;
			const delay = getRetryDelay();
			reconnectTimer = setTimeout(function() {
				reconnectTimer = null;
				retryCount++;
				connectWebSocket();
			}, delay);
		}

		function processReply(data){
			let sourceText = "";
			let targetText = "";

			if ("interm" in data) {
				sourceText = sanitize(data.originalInterm || data.originalFinal || "");
				targetText = sanitize(data.interm || "");

				if (data.ln) {
					currentLanguage = data.ln;
					setPanelLabels(currentLanguage);
				}

				setInterim("sourceInterim", sourceText || "Listening…");
				setInterim("targetInterim", targetText || "Translating…");

				try {
					if (window.CAPTION_TTS && window.CAPTION_TTS.stream && typeof window.CAPTION_TTS.speak === 'function') {
						window.CAPTION_TTS.speak(data.interm, true);
					}
				} catch(e){ console.warn(e); }

			} else if ("final" in data) {
				sourceText = sanitize(data.originalFinal || data.originalInterm || "");
				targetText = sanitize(data.final || "");

				if (data.ln) {
					currentLanguage = data.ln;
					setPanelLabels(currentLanguage);
				}

				if (sourceText) prependLine("sourceOutput", sourceText, "source");
				if (targetText) prependLine("targetOutput", targetText, "target");

				setInterim("sourceInterim", "");
				setInterim("targetInterim", "");

				var provider = (urlParams.get('ttsprovider')||'').toLowerCase();
				var forceExternal = (urlParams.get('ttslib')||'').toLowerCase() === 'rocks';
				var externalPreferred = forceExternal || ['kokoro','piper','espeak','kitten','openai'].includes(provider);
				try {
					if (externalPreferred && window.CAPTION_TTS && typeof window.CAPTION_TTS.speak === 'function') {
						window.CAPTION_TTS.speak(data.final);
					} else {
						tts.speak(data.final);
					}
				} catch(e){ console.warn(e); }
			}
		}

		function handleSocketMessage(event) {
			if (!event.data) return;
			let data;
			try {
				data = JSON.parse(event.data);
			} catch (e) {
				return;
			}

			if (data.ln && !langTo) {
				currentLanguage = data.ln;
				setPanelLabels(currentLanguage);
			}

			if (langTo && useContext && data.final) {
				messageHistory.push(data.final);
				if (messageHistory.length > contextSize + 1) messageHistory.shift();
				const contextText = messageHistory.join(' ');

				if (data.ln && langFrom !== data.ln.split("-")[0]) {
					langFrom = data.ln.split("-")[0];
					needsTranslation = langFrom.split('-')[0].toLowerCase() !== langTo.split('-')[0].toLowerCase();
					if (needsTranslation && (!googleApiKey || forceLocal)) loadModel();
				}
				translateCall(contextText, data, data.interm||false);
			} else if (langTo) {
				if (data.ln && langFrom !== data.ln.split("-")[0]) {
					langFrom = data.ln.split("-")[0];
					needsTranslation = langFrom.split('-')[0].toLowerCase() !== langTo.split('-')[0].toLowerCase();
					if (needsTranslation && (!googleApiKey || forceLocal)) loadModel();
				}
				translateCall(data.final || data.interm, data, data.interm||false);
			} else {
				processReply(data);
			}
		}

		function connectWebSocket() {
			if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;

			const ws = new WebSocket("wss://api.caption.ninja:443");
			socket = ws;

			ws.onmessage = function(event) {
				if (socket !== ws) return;
				handleSocketMessage(event);
			};

			ws.onclose = function() {
				if (socket !== ws) return;
				socket = null;
				scheduleReconnect();
			};

			ws.onopen = function() {
				if (socket !== ws) return;
				retryCount = 0;
				clearReconnectTimer();
				ws.send(JSON.stringify({"join":roomID}));
			};

			ws.onerror = function(error) {
				if (socket !== ws) return;
				console.error("WebSocket error:", error);
				if (ws.readyState !== WebSocket.CLOSED) ws.close();
			};
		}

		connectWebSocket();
		setPanelLabels("en-US");

		window.addEventListener('beforeunload', function() {
			clearReconnectTimer();
			if (socket) {
				socket.onclose = null;
				try { socket.close(); } catch (e) {}
				socket = null;
			}
		});
	</script>
</body>
</html>
